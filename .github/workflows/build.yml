name: build
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
      - ".gitignore"
    tags:
      - "*"

jobs:
  build:
    runs-on: ${{ matrix.platform.host }}
    strategy:
      matrix:
        platform:
          - name: windows-x86_64
            host: windows-2022
          - name: windows-x86
            host: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2

      - name: Detect Native CMake Path (Windows)
        id: detect_cmake
        shell: powershell
        run: |
          $cmake = (Get-Command cmake).Source
          echo "cmake_path=$cmake" >> $env:GITHUB_ENV

      - name: Install dependencies (Windows x86_64)
        if: matrix.platform.name == 'windows-x86_64'
        shell: msys2 {0}
        run: pacman -S --noconfirm base-devel git python autotools nasm

      - name: Install dependencies (Windows x86)
        if: matrix.platform.name == 'windows-x86'
        shell: msys2 {0}
        run: pacman -S --noconfirm mingw-w64-i686-toolchain base-devel git python autotools nasm

      - name: Build FFmpeg (Windows x86_64)
        if: matrix.platform.name == 'windows-x86_64'
        shell: msys2 {0}
        run: |
          export PATH="$(dirname "$(cygpath -u "$cmake_path")"):$PATH"
          bash build.sh --platform="windows"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build FFmpeg (Windows x86)
        if: matrix.platform.name == 'windows-x86'
        shell: msys2 {0}
        run: |
          export PATH="$(dirname "$(cygpath -u "$cmake_path")"):$PATH"
          bash build.sh --platform="windows"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare for artifact (Windows)
        if: matrix.platform.name == 'windows-x86_64' || matrix.platform.name == 'windows-x86'
        run: |
          Compress-Archive -Path artifacts -DestinationPath ffmpeg.${{ matrix.platform.name }}.zip

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v7
        if: matrix.platform.name == 'windows-x86_64' || matrix.platform.name == 'windows-x86'
        with:
          name: ffmpeg.${{ matrix.platform.name }}.zip
          path: ffmpeg.${{ matrix.platform.name }}.zip

  create-release:
    name: Create Release
    if: contains(github.ref, 'tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/download
        with:
          platform: windows-x86_64
      - uses: ./.github/actions/download
        with:
          platform: windows-x86
      - name: Env to output
        run: |
          echo "package_paths<<EOF" >> $GITHUB_OUTPUT
          cat package_paths.env >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        id: env
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.env.outputs.package_paths }}